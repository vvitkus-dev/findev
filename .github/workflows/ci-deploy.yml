# CI + deploy (Implementation Phase 8, Quality gates Q4.2).
# Every push and PR runs every gate; only a push to main deploys, and only when all are green.
# Actions are pinned to commit SHAs of releases at least 14 days old (same rule as npm deps).
name: CI / Deploy

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # format, lint, types, duplication, dead code, audit, dependency age
      - run: npm run static

  self-test:
    name: Gate self-test (probes)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # rustup is preinstalled on the runner; with no arguments it installs the rust-toolchain.toml pin.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: wasm/producer
      - run: cargo llvm-cov --version || cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: npm ci
      # The hook probes commit inside a throwaway worktree, so git needs an identity.
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Proves each gate still fires: lint, quality (jscpd, coverage, Rust, wasm, smoke), hook probes.
      - run: npm run quality:self-test

  test:
    name: Tests + build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: wasm/producer
      - run: cargo llvm-cov --version || cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: npm ci
      - run: npm run test:rust
      - run: npm run test:rust:mutants
      - run: npm run cov:rust
      - run: npm run wasm:build
      - run: npm run wasm:verify
      - run: npm run test:wasm
      - run: npm run test:ci
      # Unit ≥ 60 %, E2E ≤ 10 %, ≥ 3 integration tests; the table goes to the job summary.
      - run: npm run test:pyramid
      - name: Production build for GitHub Pages
        env:
          REPO: ${{ github.event.repository.name }}
        # Base href /<repo>/, the commit SHA in the footer, and 404.html as the SPA fallback.
        run: BUILD_SHA="${GITHUB_SHA::7}" node scripts/build-pages.mjs --base "$REPO"
      # The exact bundle that deploys is what the e2e job tests.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-build
          path: dist/findev/browser
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist/findev/browser

  e2e:
    name: E2E (Playwright)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Pinned image (same Playwright version as package.json) so browsers and fonts are fixed.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    env:
      HOME: /root
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages-build
          path: dist/findev/browser
      # Serves the bundle under /<repo>/ like Pages (playwright.config.ts webServer).
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            reports/playwright
            reports/playwright-results
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [static, self-test, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: Smoke-test the live site
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Retries for up to 5 minutes while the Pages CDN switches to the new build.
      - run: node scripts/smoke-deploy.mjs "${{ needs.deploy.outputs.page_url }}" --sha "${GITHUB_SHA::7}" --timeout 300

  smoke-e2e:
    name: E2E smoke on the live site
    # After `smoke`, which waits until the CDN serves this commit.
    needs: [deploy, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    env:
      HOME: /root
      HUSKY: '0'
      E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The @smoke specs: boot with live rows, and the wasm-404 banner with Retry.
      - run: npm run e2e:smoke
